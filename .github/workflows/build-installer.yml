name: Build CDM installers and cloud packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder --publish never
      - name: Upload desktop installer
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/dist/CDM-Setup-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cloud-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build cloud deployment packages
        run: |
          rm -rf /tmp/cdm-packages && mkdir -p /tmp/cdm-packages/aws /tmp/cdm-packages/gcp
          cp -R infra/aws/. /tmp/cdm-packages/aws/
          cp -R infra/gcp/. /tmp/cdm-packages/gcp/
          printf 'CDM deployment package built from commit %s\n' "$GITHUB_SHA" > /tmp/cdm-packages/VERSION.txt
          cd /tmp/cdm-packages
          zip -qr "$GITHUB_WORKSPACE/CDM-AWS-Setup.zip" aws VERSION.txt
          zip -qr "$GITHUB_WORKSPACE/CDM-Google-Cloud-Setup.zip" gcp VERSION.txt
      - name: Upload cloud packages
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CDM-AWS-Setup.zip
            CDM-Google-Cloud-Setup.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gcp-windows-gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and self-test the GCP engine
        shell: pwsh
        run: |
          npm install --global @yao-pkg/pkg@6.23.0
          Set-Location infra/gcp
          node gcp-cli.js --self-test
          pkg --target node22-win-x64 --output gui/gcp-cli.exe --public-packages '*' gcp-cli.js
          if (!(Test-Path 'gui/gcp-cli.exe') -or (Get-Item 'gui/gcp-cli.exe').Length -lt 1000000) {
            throw 'GCP deployment engine is missing or unexpectedly small.'
          }
      - name: Build portable single-window Windows app (no NSIS Setup wrapper)
        working-directory: infra/gcp/gui
        shell: pwsh
        run: |
          npm install
          npm run dist:win
          $installer = 'dist/CDM-GCP-Setup.exe'
          if (!(Test-Path $installer) -or (Get-Item $installer).Length -lt 50000000) {
            throw 'Portable GCP Windows app is missing or unexpectedly small.'
          }
      - name: Upload GCP GUI app as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: CDM-GCP-Setup-Portable
          path: infra/gcp/gui/dist/CDM-GCP-Setup.exe
          if-no-files-found: error
          retention-days: 7
      - name: Attach GCP GUI app to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: infra/gcp/gui/dist/CDM-GCP-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
