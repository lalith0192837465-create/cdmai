name: Build CDM installers and cloud packages
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  desktop:
    if: github.event_name == 'push'
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder --publish never
      - name: Upload desktop installer
        uses: softprops/action-gh-release@v2
        with:
          files: installer/dist/CDM-Setup-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  cloud-packages:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build cloud deployment packages
        run: |
          rm -rf /tmp/cdm-packages && mkdir -p /tmp/cdm-packages/aws /tmp/cdm-packages/gcp
          cp -R infra/aws/. /tmp/cdm-packages/aws/
          cp -R infra/gcp/. /tmp/cdm-packages/gcp/
          printf 'CDM deployment package built from commit %s\n' "$GITHUB_SHA" > /tmp/cdm-packages/VERSION.txt
          cd /tmp/cdm-packages
          zip -qr "$GITHUB_WORKSPACE/CDM-AWS-Setup.zip" aws VERSION.txt
          zip -qr "$GITHUB_WORKSPACE/CDM-Google-Cloud-Setup.zip" gcp VERSION.txt
      - name: Build the graphical GCP setup executable
        shell: pwsh
        run: |
          Set-Location infra/gcp
          npm install -g @yao-pkg/pkg@6.23.0
          node gcp-cli.js --self-test
          pkg --target node22-win-x64 --output gui/gcp-cli.exe --public-packages '*' gcp-cli.js
          if (!(Test-Path "gui/gcp-cli.exe") -or (Get-Item "gui/gcp-cli.exe").Length -eq 0) { throw 'Hidden GCP setup engine was not produced.' }
          Set-Location gui
          npm ci
          npm run dist:win
          if (!(Test-Path "dist/CDM-GCP-Setup.exe") -or (Get-Item "dist/CDM-GCP-Setup.exe").Length -eq 0) { throw 'Graphical GCP setup executable was not produced.' }
          Copy-Item "dist/CDM-GCP-Setup.exe" "$env:GITHUB_WORKSPACE/CDM-GCP-Setup.exe" -Force
      - name: Upload cloud packages
        uses: softprops/action-gh-release@v2
        with:
          files: |
            CDM-AWS-Setup.zip
            CDM-Google-Cloud-Setup.zip
            CDM-GCP-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  gcp-windows-cli:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build hidden GCP CLI engine
        shell: pwsh
        run: |
          npm install -g @yao-pkg/pkg@6.23.0
          Set-Location infra/gcp
          node gcp-cli.js --self-test
          pkg --target node22-win-x64 --output gui/gcp-cli.exe --public-packages '*' gcp-cli.js
          if (!(Test-Path "gui/gcp-cli.exe") -or (Get-Item "gui/gcp-cli.exe").Length -eq 0) { throw 'Hidden GCP CLI engine was not produced.' }
      - name: Build graphical GCP setup window
        working-directory: infra/gcp/gui
        shell: pwsh
        run: |
          npm ci
          npm run dist:win
          if (!(Test-Path "dist/CDM-GCP-Setup.exe") -or (Get-Item "dist/CDM-GCP-Setup.exe").Length -eq 0) { throw 'Graphical GCP setup executable was not produced.' }
      - name: Copy and upload the graphical GCP setup executable
        shell: pwsh
        run: Copy-Item "infra/gcp/gui/dist/CDM-GCP-Setup.exe" "$env:GITHUB_WORKSPACE/CDM-GCP-Setup.exe" -Force
      - name: Upload GCP-only executable as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CDM-GCP-Setup-Windows
          path: CDM-GCP-Setup.exe
          if-no-files-found: error
          retention-days: 7
